name: release

# Thin caller for metanorma/ci generic-release.yml (ci#82 / #393 / #400).

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc
        required: true
        default: "skip"
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    uses: metanorma/ci/.github/workflows/prepare-rake.yml@main

  release:
    needs: prepare
    uses: metanorma/ci/.github/workflows/generic-release.yml@main
    with:
      ruby_version: ${{ needs.prepare.outputs.default-ruby-version }}
      jar_name: mn2pdf.jar
      version_file_path: lib/mn2pdf/version.rb
      next_version: ${{ inputs.next_version || 'skip' }}
      checkout_uses_pat_token: true
      failure_issue_template: .github/RELEASE_ISSUE_TEMPLATE.md
      failure_issue_assignees: ronaldtse,opoudjis
    secrets:
      pat_token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
