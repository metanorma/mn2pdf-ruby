"name: release\n\n# Thin caller for metanorma/ci generic-release.yml (ci#82 / #393 / #400).\n\non:\n  push:\n    tags:\n      - \"*\"\n  workflow_dispatch:\n    inputs:\n      next_version:\n        description: |\n          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc\n        required: true\n        default: \"skip\"\n        type: string\n\npermissions:\n  contents: write\n  id-token: write\n\njobs:\n  prepare:\n    uses: metanorma/ci/.github/workflows/prepare-rake.yml@v1\n\n  release:\n    needs: prepare\n    uses: metanorma/ci/.github/workflows/generic-release.yml@v1\n    with:\n      ruby_version: ${{ needs.prepare.outputs.default-ruby-version }}\n      jar_name: mn2pdf.jar\n      version_file_path: lib/mn2pdf/version.rb\n      next_version: ${{ inputs.next_version || 'skip' }}\n      checkout_uses_pat_token: true\n      failure_issue_template: .github/RELEASE_ISSUE_TEMPLATE.md\n      failure_issue_assignees: ronaldtse,opoudjis\n    secrets:\n      pat_token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}\n"
